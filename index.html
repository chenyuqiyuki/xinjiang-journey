<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新疆 · 一段为你铺开的路</title>
<link rel="preload" href="fonts/serifsc.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Noto Serif SC';font-weight:400 900;font-display:swap;
  src:url(fonts/serifsc.woff2) format('woff2');}
@font-face{font-family:'Noto Sans SC';font-weight:300 500;font-display:swap;
  src:url(fonts/sanssc.woff2) format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;
  src:url(fonts/cormorant.woff2) format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;
  src:url(fonts/cormorant-italic.woff2) format('woff2');}
</style>
<style>
/* ============================================================
   新疆旅行 · 问答→画像→地图 三屏闭环
   地图渲染引擎逐字沿用 xinjiang-map-demo.html(久经验证)
   前置两屏:审美问答(quiz) / 画像揭晓(profile)
   ============================================================ */
:root{
  --paper:#F5E6DC;      /* 粉米底(陆地) */
  --paper-2:#EFDBCB;    /* 暖色块 */
  --coral:#E8917C;      /* 珊瑚橘(沙漠/强调) */
  --navy:#2A3A5C;       /* 深藏青(线/字/边界) */
  --navy-soft:#4A5A7C;
  --water:#5B9DB0;      /* 蓝绿(水体) */
  --water-2:#8FBFC9;    /* 浅水 */
  --gold:#C89A4E;       /* 打卡金(印章) */
  --gold-soft:#E0C088;
  --mtn:#B9A48C;        /* 山体写意 */
  --f-serif:'Noto Serif SC',serif;
  --f-sans:'Noto Sans SC',sans-serif;
  --f-orn:'Cormorant Garamond',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#E4D5C6;font-family:var(--f-sans);color:var(--navy)}

/* ============================================================
   三屏容器:quiz / profile 满屏覆盖(z-100),map viewport 在底(z-1)
   goto() 切换 .on 类,opacity 淡入淡出
   ============================================================ */
.screen{position:fixed;inset:0;z-index:100;opacity:0;pointer-events:none;
  transition:opacity 1.1s ease;overflow:hidden}
.screen.on{opacity:1;pointer-events:auto}

/* ---------- 问答屏:苍茫渐变背景,单题居中 ---------- */
#scrQuiz{background:
  radial-gradient(130% 90% at 50% 0%, #E8DAC9 0%, #DBC7B2 55%, #C9B199 100%)}
#scrQuiz::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(var(--navy) 1px,transparent 1px);background-size:6px 6px}
.quiz-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
/* 顶部细进度 */
.quiz-prog{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.quiz-prog .dot{width:7px;height:7px;border-radius:50%;background:rgba(42,58,92,.22);transition:.4s}
.quiz-prog .dot.done{background:var(--gold)}
.quiz-prog .dot.cur{background:var(--navy);transform:scale(1.5)}
.quiz-prog .qn{font-family:var(--f-orn);font-style:italic;font-size:15px;color:var(--navy-soft);margin-left:10px;letter-spacing:1px}
/* 单题卡:淡入淡出切换 */
.qcard{width:min(920px,94%);text-align:center;opacity:0;transform:translateY(18px);
  transition:opacity .7s ease,transform .7s ease}
.qcard.on{opacity:1;transform:none}
.qcard .q-kicker{font-family:var(--f-orn);font-style:italic;font-size:17px;color:var(--gold);letter-spacing:3px;margin-bottom:10px}
.qcard .q-prompt{font-family:var(--f-serif);font-weight:900;font-size:34px;line-height:1.4;color:var(--navy);letter-spacing:1px}
.qcard .q-sub{font-size:15px;color:var(--navy-soft);margin-top:12px;letter-spacing:1px;line-height:1.7}
/* 选项区:2 或 3 项自适应 */
.q-opts{display:flex;gap:22px;justify-content:center;margin-top:42px;flex-wrap:wrap}
.q-opt{width:280px;background:rgba(247,236,224,.72);border:1.5px solid var(--navy);
  cursor:pointer;overflow:hidden;transition:.28s cubic-bezier(.16,1,.3,1);
  box-shadow:4px 4px 0 rgba(42,58,92,.5);display:flex;flex-direction:column}
.q-opt:hover{transform:translateY(-6px);box-shadow:7px 10px 0 rgba(42,58,92,.5);background:var(--paper)}
.q-opt .vis{width:100%;height:170px;background:#EFE2D2;display:flex;align-items:center;justify-content:center;
  border-bottom:1.5px solid var(--navy);overflow:hidden}
.q-opt .vis svg{width:100%;height:100%;display:block}
.q-opt .vis .emoji{font-size:74px;line-height:1}
.q-opt .vis .swatch{width:100%;height:100%}
.q-opt .lbl{padding:16px 18px;font-family:var(--f-serif);font-size:18px;font-weight:600;color:var(--navy);line-height:1.5}
/* 三项时略窄 */
.q-opts.three .q-opt{width:236px}
.q-opts.three .q-opt .vis{height:150px}

/* ---------- 画像屏:诗意克制,深底衬托 ---------- */
#scrProfile{background:
  radial-gradient(120% 100% at 50% 15%, #34435F 0%, #283349 60%, #1E2637 100%);color:#EEE2D2}
.prof-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;text-align:center}
.prof-wrap .p-kicker{font-family:var(--f-orn);font-style:italic;font-size:18px;color:var(--gold-soft);letter-spacing:4px;
  opacity:0;transition:opacity 1.2s ease .2s}
.prof-wrap.reveal .p-kicker{opacity:.9}
.prof-radar{margin:18px 0 6px;opacity:0;transform:scale(.92);transition:opacity 1.4s ease .5s,transform 1.4s ease .5s}
.prof-wrap.reveal .prof-radar{opacity:1;transform:none}
.prof-arch{font-family:var(--f-serif);font-weight:900;font-size:46px;letter-spacing:3px;color:#F6ECDC;
  opacity:0;transform:translateY(12px);transition:opacity 1.2s ease 1.1s,transform 1.2s ease 1.1s}
.prof-wrap.reveal .prof-arch{opacity:1;transform:none}
.prof-kw{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px;
  opacity:0;transition:opacity 1.2s ease 1.5s}
.prof-wrap.reveal .prof-kw{opacity:1}
.prof-kw span{font-family:var(--f-orn);font-style:italic;font-size:19px;color:var(--gold-soft);letter-spacing:2px;
  border-bottom:1px solid rgba(224,192,136,.4);padding-bottom:2px}
.prof-poem{max-width:620px;margin:30px auto 0;font-family:var(--f-serif);font-size:20px;line-height:2.1;color:#DCCFBE;
  opacity:0;transition:opacity 1.4s ease 1.9s}
.prof-wrap.reveal .prof-poem{opacity:1}
.prof-cta{margin-top:44px;padding:15px 46px;font-family:var(--f-serif);font-weight:600;font-size:19px;letter-spacing:4px;
  background:var(--gold);border:none;color:var(--navy);cursor:pointer;border-radius:2px;
  opacity:0;transform:translateY(10px);transition:opacity 1.2s ease 2.4s,transform 1.2s ease 2.4s,background .3s;
  box-shadow:0 10px 30px -8px rgba(200,154,78,.5)}
.prof-wrap.reveal .prof-cta{opacity:1;transform:none}
.prof-cta:hover{background:var(--gold-soft)}
.prof-radar text{font-family:var(--f-sans);font-size:13px;fill:#C7BAAA}

/* ============================================================
   屏 2.5:确定性约束收集(与画像屏同族:深靛底 + 衬线 + 金)
   ============================================================ */
#scrConst{background:
  radial-gradient(120% 100% at 50% 12%, #34435F 0%, #283349 60%, #1E2637 100%);color:#EEE2D2}
#scrConst::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(#EEE2D2 1px,transparent 1px);background-size:6px 6px}
.cons-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 48px;text-align:center;overflow-y:auto}
.cons-wrap .c-kicker{font-family:var(--f-orn);font-style:italic;font-size:18px;color:var(--gold-soft);letter-spacing:4px;
  opacity:0;transition:opacity 1s ease .1s}
.cons-wrap.reveal .c-kicker{opacity:.9}
.cons-wrap .c-title{font-family:var(--f-serif);font-weight:900;font-size:40px;letter-spacing:3px;color:#F6ECDC;margin-top:10px;
  opacity:0;transform:translateY(10px);transition:opacity 1s ease .3s,transform 1s ease .3s}
.cons-wrap.reveal .c-title{opacity:1;transform:none}
.cons-wrap .c-sub{font-family:var(--f-serif);font-size:18px;color:#C7BAAA;margin-top:10px;letter-spacing:1px;
  opacity:0;transition:opacity 1s ease .5s}
.cons-wrap.reveal .c-sub{opacity:1}
.cons-fields{display:flex;flex-direction:column;gap:22px;margin-top:34px;width:100%;max-width:680px}
.cons-field{opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
.cons-wrap.reveal .cons-field{opacity:1;transform:none}
.cons-wrap.reveal .cons-field:nth-child(1){transition-delay:.7s}
.cons-wrap.reveal .cons-field:nth-child(2){transition-delay:.9s}
.cons-wrap.reveal .cons-field:nth-child(3){transition-delay:1.1s}
.cons-wrap.reveal .cons-field:nth-child(4){transition-delay:1.3s}
.cons-field > .cf-label{font-family:var(--f-orn);font-style:italic;font-size:17px;color:var(--gold-soft);letter-spacing:2px;
  display:block;margin-bottom:12px;text-align:left}
.cf-opts{display:flex;gap:12px;flex-wrap:wrap}
.cf-opt{flex:1 1 0;min-width:120px;padding:13px 12px;cursor:pointer;border-radius:3px;
  background:rgba(238,226,210,.05);border:1px solid rgba(224,192,136,.28);color:#DCCFBE;
  font-family:var(--f-serif);transition:background .25s,border-color .25s,transform .15s;text-align:center}
.cf-opt:hover{background:rgba(224,192,136,.12);transform:translateY(-2px)}
.cf-opt.sel{background:rgba(224,192,136,.22);border-color:var(--gold);color:#F6ECDC;box-shadow:0 6px 20px -8px rgba(200,154,78,.5)}
.cf-opt .cf-main{font-size:18px;font-weight:600;letter-spacing:1px}
.cf-opt .cf-note{font-family:var(--f-sans);font-size:12px;color:#B3A791;margin-top:5px;line-height:1.4}
.cf-opt.sel .cf-note{color:#D8C7A6}
.cons-cta{margin-top:40px;padding:15px 46px;font-family:var(--f-serif);font-weight:600;font-size:19px;letter-spacing:4px;
  background:var(--gold);border:none;color:var(--navy);cursor:pointer;border-radius:2px;
  opacity:.35;pointer-events:none;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease,background .3s;
  box-shadow:0 10px 30px -8px rgba(200,154,78,.5)}
.cons-wrap.reveal .cons-cta{transform:none}
.cons-cta.ready{opacity:1;pointer-events:auto}
.cons-cta.ready:hover{background:var(--gold-soft)}
.cons-skip{display:block;margin:18px auto 0;background:none;border:none;cursor:pointer;
  font-family:var(--f-serif);font-size:15px;letter-spacing:1px;color:#8E8574;
  opacity:0;transition:opacity .8s ease 1.5s,color .3s}
.cons-wrap.reveal .cons-skip{opacity:.75}
.cons-skip:hover{color:var(--gold-soft)}

/* ============================================================
   以下:地图屏样式 —— 逐字沿用 xinjiang-map-demo.html
   ============================================================ */
/* ---------- 舞台:固定 1440x1080 比例,整体缩放 ---------- */
.viewport{position:fixed;inset:0;z-index:1;overflow:hidden;background:#D8C8B8;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1440px;height:1080px;background:var(--paper);transform-origin:center center;
  box-shadow:0 30px 80px rgba(42,58,92,.35);overflow:hidden}

/* ---------- 纸纹与网点质感 ---------- */
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.05;
  background-image:radial-gradient(var(--navy) 1px,transparent 1px);background-size:6px 6px}

/* ---------- 地图 SVG ---------- */
#map{position:absolute;inset:0;width:100%;height:100%}
/* 小人物覆盖层:铺满、不拦截点击 */
#walkerLayer{position:absolute;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
#figure{transition:none;transform-box:view-box;transform-origin:0 0}

/* 时辰光影遮罩:混合模式贴合底图,颜色由 JS 按进度插值 */
#daylight{position:absolute;inset:0;z-index:34;pointer-events:none;mix-blend-mode:soft-light;
  transition:background 2.4s ease, opacity 2.4s ease;opacity:.85}
/* 黄昏金光:正常叠加,越近终点越浓,给下缘镶金 */
#duskGlow{position:absolute;inset:0;z-index:36;pointer-events:none;opacity:0;
  transition:opacity 2.4s ease;
  background:radial-gradient(140% 80% at 50% 118%, rgba(240,168,74,.85) 0%, rgba(230,140,60,.32) 40%, transparent 68%),
             linear-gradient(0deg, rgba(210,120,50,.28) 0%, transparent 30%)}

/* 行走中路旁低语:淡入淡出的短语,营造"世界在轻声说话" */
.whisper{font-family:var(--f-orn);font-style:italic;fill:var(--navy-soft);
  font-size:19px;opacity:0;letter-spacing:1px}
.whisper.show{animation:whisperFade 3.4s ease forwards}
@keyframes whisperFade{
  0%{opacity:0;transform:translateY(6px)}
  22%{opacity:.72;transform:translateY(0)}
  70%{opacity:.72}
  100%{opacity:0;transform:translateY(-8px)}
}

/* ---------- 到达叙事:一封被翻开的信「这一页的故事」 ---------- */
#story{position:absolute;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 40%, rgba(58,42,30,.34), rgba(42,34,26,.66));
  opacity:0;pointer-events:none;transition:opacity 1s ease}
#story.on{opacity:1;pointer-events:auto}
#story .story-inner{width:min(680px,82%);position:relative;
  background:linear-gradient(158deg,#FBF4E8 0%,#F4E7D5 100%);
  padding:52px 56px 44px;border-radius:3px;
  box-shadow:0 40px 90px -20px rgba(30,22,16,.55), 0 2px 0 rgba(255,255,255,.5) inset;
  transform:translateY(24px) scale(.97);transition:transform 1s cubic-bezier(.22,1,.36,1);
  background-image:linear-gradient(158deg,#FBF4E8 0%,#F4E7D5 100%),
    repeating-linear-gradient(0deg,transparent 0 33px,rgba(42,58,92,.045) 33px 34px)}
#story.on .story-inner{transform:translateY(0) scale(1)}
/* 信纸左侧折痕 + 右下角微卷 */
#story .story-inner::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1px;
  background:rgba(200,90,60,.28)}
#story .story-day{font-family:var(--f-orn);font-style:italic;font-size:17px;color:var(--gold);
  letter-spacing:2px;margin-bottom:6px;padding-left:22px}
#story .story-nm{font-family:var(--f-serif);font-weight:900;font-size:30px;color:var(--navy);
  margin:0 0 22px;padding-left:22px}
#story .story-lines{padding-left:22px}
#story .story-lines p{font-family:var(--f-serif);font-size:21px;line-height:2.05;color:#3A4A66;
  margin:0 0 2px;opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s ease}
#story .story-lines p.show{opacity:1;transform:none}
#story .story-sign{margin-top:26px;padding-left:22px;font-family:var(--f-orn);font-style:italic;
  font-size:18px;color:var(--navy-soft);text-align:right;opacity:0;transition:opacity 1.2s ease}
#story .story-sign.show{opacity:.9}
#story button{margin-top:30px;margin-left:22px;background:none;border:1px solid var(--navy-soft);
  color:var(--navy);padding:9px 24px;border-radius:22px;font-family:var(--f-sans);font-size:14px;
  cursor:pointer;letter-spacing:2px;opacity:0;transition:opacity 1.2s ease}
#story button.show{opacity:1}
#story button:hover{background:var(--navy);color:#F7ECE0}

/* ---------- 顶部标题牌 ---------- */
.title-plate{position:absolute;right:60px;bottom:120px;z-index:40;text-align:right}
/* 柔和纸晕托底(独立层,z-index 在地标之下、底图之上):
   标题牌落在哪条路线上都读得清,身后地标被轻晕淡开而非硬碰 */
.plate-scrim{position:absolute;right:-30px;bottom:50px;width:660px;height:440px;z-index:28;pointer-events:none;
  background:radial-gradient(115% 115% at 82% 74%, var(--paper) 0%, var(--paper) 30%, rgba(232,220,200,.68) 54%, rgba(232,220,200,0) 76%)}
.title-plate .zh{font-family:var(--f-serif);font-weight:900;font-size:70px;line-height:.92;letter-spacing:6px;color:var(--navy)}
.title-plate .en{font-family:var(--f-orn);font-style:italic;font-size:28px;color:var(--navy-soft);letter-spacing:3px;margin-top:6px}
.title-plate .rule{width:280px;height:2px;background:var(--navy);margin:12px 0 10px auto}
.title-plate .sub{font-size:15px;letter-spacing:2px;color:var(--navy-soft);max-width:420px;margin-left:auto;line-height:1.6}

/* ---------- 指北针 + 比例尺 ---------- */
.compass{position:absolute;left:56px;top:48px;z-index:40;text-align:center;color:var(--navy)}
.compass .n{font-family:var(--f-orn);font-size:24px;font-weight:600}
.compass .arrow{font-size:20px;line-height:1}
.scale{position:absolute;left:110px;top:58px;z-index:40;font-size:12px;letter-spacing:1px;color:var(--navy-soft)}
.scale .bar{width:120px;height:6px;border:1.5px solid var(--navy);border-top:none;display:flex;margin-top:2px}
.scale .bar i{flex:1;height:100%}
.scale .bar i:nth-child(odd){background:var(--navy)}

/* ---------- 进度 HUD(顶部右) ---------- */
.hud{position:absolute;right:40px;top:36px;z-index:45;text-align:right;opacity:.62;transition:opacity .4s}
.hud:hover{opacity:1}
.hud .plate{background:none;border:none;padding:0;box-shadow:none}
.hud .lab{font-family:var(--f-orn);font-style:italic;font-size:12px;color:var(--navy-soft);letter-spacing:1px;opacity:.75}
.hud .big{font-family:var(--f-serif);font-weight:600;font-size:18px;color:var(--navy-soft);line-height:1;margin-top:1px}
.hud .big .cur{color:var(--gold);font-weight:900}
.hud .pbar{width:120px;height:2px;background:rgba(42,58,92,.18);border:none;margin:8px 0 0 auto;overflow:hidden}
.hud .pbar i{display:block;height:100%;width:0;background:var(--gold);transition:width .8s cubic-bezier(.16,1,.3,1)}
.hud .badges{margin-top:10px;display:flex;gap:5px;justify-content:flex-end}
.hud .badge{width:22px;height:22px;border-radius:50%;border:1px solid rgba(42,58,92,.3);background:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.3;filter:grayscale(1);transition:.4s}
.hud .badge.on{opacity:.95;filter:none;background:var(--gold-soft);border-color:var(--gold);box-shadow:none}

/* ---------- 点位 pin ---------- */
.pin{position:absolute;transform:translate(-50%,-100%);z-index:30;cursor:pointer;transition:transform .2s}
.pin:hover{transform:translate(-50%,-100%) scale(1.12);z-index:35}
.pin .stack{position:relative;display:flex;flex-direction:column;align-items:center}
.pin .icon{width:44px;height:44px;border-radius:50%;background:var(--paper);border:2px solid var(--navy);
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:2px 2px 0 var(--navy);position:relative}
.pin .icon .stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-serif);font-weight:900;font-size:20px;color:#fff;opacity:0;transform:scale(2) rotate(-18deg);transition:none}
.pin .tip{width:14px;height:14px;background:var(--paper);border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);
  transform:rotate(45deg);margin:-9px auto 0}
.pin .lbl{font-family:var(--f-serif);font-weight:600;font-size:15px;color:var(--navy);
  background:var(--paper);padding:1px 8px;border:1px solid var(--navy);white-space:nowrap;
  position:absolute;left:50%;transform:translateX(-50%)}
/* 标签四向偏移(避免重叠) */
.pin[data-dir="bottom"] .lbl{top:calc(100% + 4px)}
.pin[data-dir="top"] .lbl{bottom:calc(100% + 4px)}
.pin[data-dir="left"] .lbl{top:14px;left:auto;right:calc(100% + 6px);transform:none}
.pin[data-dir="right"] .lbl{top:14px;left:calc(100% + 6px);transform:none}
/* 未计划:暗淡 */
.pin[data-state="idle"] .icon{opacity:.5;filter:grayscale(.6);border-style:dashed}
.pin[data-state="idle"] .lbl{opacity:.5}
/* 已计划:亮起 */
.pin[data-state="planned"] .icon{background:var(--gold-soft);opacity:1;filter:none}
/* 已到达:盖金章 */
.pin[data-state="arrived"] .icon{background:var(--gold);border-color:var(--gold);opacity:1;filter:none}
.pin[data-state="arrived"] .icon .glyph{opacity:0}
.pin[data-state="arrived"] .icon .stamp{opacity:1;transform:scale(1) rotate(-18deg);transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s}

/* ---------- 到达仪式 A4 / 路径书写 A3 ---------- */
/* 纸面微震(极轻位移)—— 作用于地图内容层,避免与 stage 的 scale 内联样式冲突 */
@keyframes paperShake{
  0%{transform:translate(0,0)}
  20%{transform:translate(-2px,1px)}
  40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,-1px)}
  80%{transform:translate(1px,1px)}
  100%{transform:translate(0,0)}
}
.stage.shake #map,.stage.shake #pins{animation:paperShake .3s ease-in-out}
/* 淡金涟漪:一圈 border 由小放大+淡出,定位于 pin 图标中心 */
.pin .ripple{position:absolute;left:50%;top:22px;width:44px;height:44px;margin:-22px 0 0 -22px;
  border-radius:50%;border:2px solid var(--gold);pointer-events:none;z-index:40;
  animation:pinRipple .72s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pinRipple{
  0%{transform:scale(.4);opacity:.85}
  100%{transform:scale(2.4);opacity:0}
}
/* 盖章脉冲:落章后一次短促放大回弹 */
@keyframes stampPulse{
  0%{transform:scale(1) rotate(-18deg)}
  45%{transform:scale(1.28) rotate(-18deg)}
  100%{transform:scale(1) rotate(-18deg)}
}
.pin .stamp.pulse{animation:stampPulse .5s cubic-bezier(.34,1.56,.64,1)}
/* 金线描出后的静态呈现由 JS 内联 transition 处理,此处兜底 */
.route-lit{transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
/* B3 回放:信笺快闪层 */
.replay-flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:70;
  background:var(--paper);border:2px solid var(--navy);box-shadow:8px 8px 0 var(--navy);
  padding:22px 30px;max-width:440px;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s cubic-bezier(.16,1,.3,1)}
.replay-flash.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.replay-flash .rf-nm{font-family:var(--f-serif);font-weight:900;font-size:26px;color:var(--navy);letter-spacing:1px}
.replay-flash .rf-tx{font-family:var(--f-serif);font-size:16px;color:var(--navy);opacity:.8;margin-top:8px;line-height:1.6}
.replay-flash .rf-en{font-family:var(--f-orn);font-style:italic;font-size:15px;color:var(--gold);margin-top:6px}
/* 回放态:禁用交互 */
.stage.replaying .pin{pointer-events:none}
.stage.replaying .footbar{opacity:.4;pointer-events:none}

/* ---------- 卡片弹窗 ---------- */
.card-mask{position:absolute;inset:0;z-index:80;background:rgba(42,58,92,.28);display:none;align-items:center;justify-content:center}
.card-mask.on{display:flex}
.card{width:560px;max-height:840px;background:var(--paper);border:2px solid var(--navy);box-shadow:10px 10px 0 var(--navy);
  transform:translateY(20px);opacity:0;transition:.4s cubic-bezier(.16,1,.3,1);overflow:hidden;display:flex;flex-direction:column}
.card-mask.on .card{transform:translateY(0);opacity:1}
.card .hd{background:var(--navy);color:var(--paper);padding:26px 30px;position:relative}
.card .hd .day{font-family:var(--f-orn);font-style:italic;font-size:17px;color:var(--gold-soft);letter-spacing:1px}
.card .hd .nm{font-family:var(--f-serif);font-weight:900;font-size:38px;letter-spacing:2px;margin-top:2px}
.card .hd .en{font-family:var(--f-orn);font-size:16px;opacity:.7;letter-spacing:2px}
.card .hd .close{position:absolute;right:22px;top:22px;width:34px;height:34px;border:1.5px solid var(--paper);color:var(--paper);
  background:none;font-size:18px;cursor:pointer;border-radius:50%}
.card .bd{padding:26px 30px;overflow-y:auto}
.card .sec{margin-bottom:22px}
.card .sec h4{font-family:var(--f-serif);font-size:15px;letter-spacing:3px;color:var(--gold);border-bottom:1px solid var(--navy);
  padding-bottom:6px;margin-bottom:10px;display:flex;justify-content:space-between}
.card .sec h4 .meta{color:var(--navy-soft);font-weight:400;letter-spacing:1px}
.card .sec p{font-size:15px;line-height:1.9;color:var(--navy)}
.card .note{font-family:var(--f-orn);font-style:italic;font-size:19px;line-height:1.6;color:var(--navy-soft);
  border-left:3px solid var(--gold);padding-left:16px}
/* 顶部配图(卡片内,圆角细描边) */
.card-photo{position:relative;width:100%;height:210px;margin-bottom:22px;border:1.5px solid var(--navy);
  border-radius:10px;overflow:hidden;background:var(--paper-2)}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(1.02) contrast(1.02);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.card-photo:hover img{transform:scale(1.04)}
.card-photo .photo-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 16px 10px;
  font-family:var(--f-serif);font-weight:700;font-size:17px;letter-spacing:1px;color:#fff;
  background:linear-gradient(to top,rgba(20,28,48,.72),transparent)}
/* 氛围渐变兜底(无图或加载失败),按点位类型着色 */
.card-photo.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center}
.card-photo.placeholder img{display:none}
.card-photo.placeholder .ph-emoji{font-size:54px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.card-photo.placeholder .photo-cap{background:linear-gradient(to top,rgba(20,28,48,.35),transparent)}
.card-photo.ph-culture{background:linear-gradient(135deg,#c98a3c,#8a5a24)}
.card-photo.ph-sight{background:linear-gradient(135deg,#4a7fa5,#2a4a6c)}
.card-photo.ph-transit{background:linear-gradient(135deg,#8a94a8,#4a5570)}
/* 「这个地点,值得——」手风琴 */
.card .worth .worth-list{display:flex;flex-direction:column;gap:9px}
.worth-item{border:1px solid var(--navy);border-radius:8px;overflow:hidden;background:var(--paper-2);transition:.2s}
.worth-item:hover{background:var(--gold-soft)}
.worth-item.open{background:var(--paper);box-shadow:3px 3px 0 var(--navy)}
.worth-t{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 15px;background:none;border:none;cursor:pointer;text-align:left}
.worth-tx{font-family:var(--f-serif);font-weight:700;font-size:15.5px;line-height:1.5;color:var(--navy)}
.worth-cv{flex:none;font-size:18px;color:var(--gold);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.worth-item.open .worth-cv{transform:rotate(180deg)}
.worth-d{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.16,1,.3,1)}
.worth-d p{font-size:14px;line-height:1.85;color:var(--navy-soft);padding:0 16px 14px}
.card .actions{display:flex;gap:12px;padding:20px 30px;border-top:1.5px solid var(--navy);background:var(--paper-2)}
.card .actions button{flex:1;padding:13px;font-family:var(--f-serif);font-weight:600;font-size:16px;letter-spacing:2px;
  cursor:pointer;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);transition:.2s}
.card .actions button:hover{background:var(--navy);color:var(--paper)}
.card .actions button.gold{background:var(--gold);border-color:var(--gold-deep,#a87d2f)}
.card .actions button.gold:hover{background:var(--gold-soft);color:var(--navy)}
.card .actions button:disabled{opacity:.4;cursor:default;background:var(--paper-2)}
.card .stampts{font-family:var(--f-orn);font-style:italic;font-size:14px;color:var(--gold);text-align:center;padding:0 30px 16px}

/* ---------- 完成祝贺 ---------- */
.congrats{position:absolute;inset:0;z-index:90;background:rgba(42,58,92,.92);display:none;flex-direction:column;
  align-items:center;justify-content:center;color:var(--paper);text-align:center}
.congrats.on{display:flex}
/* B4 合章书页:竖版藏书票/邮票 */
.stamp-card{width:392px;background:var(--paper);color:var(--navy);position:relative;
  padding:0;box-shadow:0 18px 60px rgba(0,0,0,.4);
  transform:scale(.86) translateY(16px);opacity:0;transition:.55s cubic-bezier(.16,1,.3,1)}
.congrats.on .stamp-card{transform:scale(1) translateY(0);opacity:1}
.stamp-card svg{display:block;width:100%;height:auto}
.congrats-actions{margin-top:28px;display:flex;gap:14px}
.congrats-actions button{padding:13px 30px;font-family:var(--f-serif);font-size:16px;letter-spacing:2px;
  border:1.5px solid var(--paper);background:none;color:var(--paper);cursor:pointer;transition:.2s}
.congrats-actions button:hover{background:var(--paper);color:var(--navy)}
.congrats-actions button.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.congrats-actions button.gold:hover{background:var(--gold-soft)}
/* 音效开关(HUD 内,右上) */
.snd-toggle{position:absolute;right:0;top:-30px;width:26px;height:26px;border:1px solid rgba(42,58,92,.3);
  background:var(--paper);border-radius:50%;font-size:13px;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;opacity:.8;transition:.2s}
.snd-toggle:hover{opacity:1;border-color:var(--gold)}
.snd-toggle.on{background:var(--gold-soft);border-color:var(--gold)}

/* ---------- 底部操作条 ---------- */
.footbar{position:absolute;left:56px;bottom:48px;z-index:40;display:flex;gap:12px}
.footbar button{font-family:var(--f-serif);font-size:14px;letter-spacing:2px;padding:10px 18px;border:1.5px solid var(--navy);
  background:var(--paper);color:var(--navy);cursor:pointer;box-shadow:2px 2px 0 var(--navy);transition:.2s}
.footbar button:hover{background:var(--navy);color:var(--paper)}
</style>
</head>
<body>

<script>
/* ============================================================
   PART A · 审美问答:10 题投射题库 + 零依赖视觉注册表
   轴符号(DESIGN.md §B,左极为负右极为正):
     A 优美− 崇高+   B 含蓄− 直白+   C 形式静观− 功能卷入+
     D 繁复− 极简+   E 智性− 体验+   F 沉浸− 静观+
   delta:强迫选 ±0.9,次要轴 ±0.4
   ============================================================ */

// ---- 零依赖视觉:内联 SVG 缩略图(迫选题的两张"照片") ----
function VISUALS(name){
  const f='#3A4A66';               // 线稿色
  const wrap=(inner,bg)=>`<svg viewBox="0 0 280 170" preserveAspectRatio="xMidYMid slice"><rect width="280" height="170" fill="${bg||'#EFE2D2'}"/>${inner}</svg>`;
  switch(name){
    // q1 房间:极简大留白 vs 挂满画作
    case 'minimalRoom': return wrap(`
      <rect x="40" y="40" width="200" height="110" fill="none" stroke="${f}" stroke-width="1.5"/>
      <rect x="150" y="95" width="70" height="45" fill="#DCCBB6" stroke="${f}" stroke-width="1.2"/>
      <line x1="40" y1="118" x2="240" y2="118" stroke="${f}" stroke-width="1" opacity=".5"/>
      <circle cx="70" cy="70" r="3" fill="${f}"/>`,'#F1E7DA');
    case 'maximalRoom': return wrap(`
      ${[...Array(12)].map((_,i)=>{const x=30+ (i%4)*58, y=32+Math.floor(i/4)*40;
        return `<rect x="${x}" y="${y}" width="44" height="30" fill="${['#E8917C','#5B9DB0','#C89A4E','#4A5A7C'][i%4]}" opacity=".8" stroke="${f}" stroke-width="1"/>`}).join('')}
      <rect x="20" y="150" width="240" height="12" fill="#C9B79E"/>`,'#EFE2D2');
    // q5 花园:几何法式 vs 自然野趣
    case 'gardenFormal': return wrap(`
      <rect x="30" y="30" width="220" height="110" fill="none" stroke="${f}" stroke-width="1.3"/>
      <line x1="140" y1="30" x2="140" y2="140" stroke="${f}" stroke-width="1"/>
      <line x1="30" y1="85" x2="250" y2="85" stroke="${f}" stroke-width="1"/>
      ${[[85,57],[195,57],[85,113],[195,113]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="16" fill="#9FB88C" stroke="${f}" stroke-width="1.2"/>`).join('')}
      <circle cx="140" cy="85" r="10" fill="#C89A4E"/>`,'#EDE6D5');
    case 'gardenWild': return wrap(`
      ${[...Array(16)].map((_,i)=>{const x=25+Math.random()*0;return ''}).join('')}
      ${[[55,120],[95,95],[140,125],[180,90],[220,118],[75,60],[160,55],[210,60]].map(([x,y],i)=>
        `<circle cx="${x}" cy="${y}" r="${10+i%4*4}" fill="${['#9FB88C','#7FA06A','#B7C99E'][i%3]}" opacity=".9"/>`).join('')}
      <path d="M20,150 Q80,135 140,148 T260,140" fill="none" stroke="#7FA06A" stroke-width="3"/>`,'#E8E4D0');
    // q6 优美(晨光露珠) vs 崇高(暴风黑海)
    case 'dawnDew': return wrap(`
      <rect width="280" height="170" fill="#F3E4CE"/>
      <circle cx="140" cy="60" r="34" fill="#F8D9A0" opacity=".8"/>
      <path d="M30,120 Q90,108 150,118 T260,112" fill="none" stroke="#9FB88C" stroke-width="2.5"/>
      ${[[90,110],[150,116],[200,110]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="#BFE0EA" stroke="#8FBFC9" stroke-width="1"/>`).join('')}`,'#F3E4CE');
    case 'stormSea': return wrap(`
      <rect width="280" height="170" fill="#2E3A4E"/>
      <path d="M0,95 Q40,70 80,95 T160,95 T240,95 T320,95" fill="none" stroke="#5A6B82" stroke-width="3"/>
      <path d="M0,120 Q40,100 80,120 T160,120 T240,120 T320,120" fill="none" stroke="#42506A" stroke-width="4"/>
      <path d="M0,150 Q40,132 80,150 T160,150 T240,150 T320,150" fill="#1E2637"/>
      <line x1="210" y1="10" x2="180" y2="80" stroke="#E0C088" stroke-width="1.5" opacity=".7"/>`,'#2E3A4E');
    // q9 完满(新瓷碗) vs 侘寂(金缮旧碗)
    case 'perfectBowl': return wrap(`
      <ellipse cx="140" cy="130" rx="70" ry="16" fill="#DCEAEA" stroke="${f}" stroke-width="1.2"/>
      <path d="M70,130 Q140,52 210,130" fill="#EAF3F3" stroke="${f}" stroke-width="1.4"/>
      <ellipse cx="140" cy="72" rx="52" ry="12" fill="#F5FAFA" stroke="${f}" stroke-width="1.2"/>`,'#EDE9E0');
    case 'kintsugiBowl': return wrap(`
      <ellipse cx="140" cy="130" rx="70" ry="16" fill="#D9CBB6" stroke="${f}" stroke-width="1.2"/>
      <path d="M70,130 Q140,52 210,130" fill="#E4D6C0" stroke="${f}" stroke-width="1.4"/>
      <ellipse cx="140" cy="72" rx="52" ry="12" fill="#EFE3CF" stroke="${f}" stroke-width="1.2"/>
      <path d="M118,64 L128,96 L120,120" fill="none" stroke="#C89A4E" stroke-width="2.4"/>
      <path d="M170,70 L158,100" fill="none" stroke="#C89A4E" stroke-width="2.2"/>`,'#EDE9E0');
    default: return wrap(`<text x="140" y="90" text-anchor="middle" fill="${f}">${name}</text>`);
  }
}
// 色板题:纯 CSS 渐变
function SWATCH(kind){
  const g={
    calm:  'linear-gradient(135deg,#D8CBB6,#B9A48C 55%,#9FA890)',      // 低饱和米灰原木
    bw:    'linear-gradient(135deg,#F2F2F2,#111 120%)',                 // 高对比黑白
    vivid: 'linear-gradient(135deg,#E8917C,#C89A4E 40%,#5B9DB0)'        // 明亮撞色
  }[kind];
  return `<div class="swatch" style="background:${g}"></div>`;
}

// ---- 10 题(固定顺序) ----
const QUESTIONS=[
  {id:'q1',type:'image',kicker:'ONE',prompt:'哪个房间,你更想待一下午?',sub:'不为做什么,只是待着',
   opts:[
     {vis:{svg:'minimalRoom'},label:'大留白 · 一种材质到底',delta:{D:+0.9,C:-0.4}},
     {vis:{svg:'maximalRoom'},label:'挂满画作 · 图案层叠',delta:{D:-0.9,C:+0.4}}]},
  {id:'q2',type:'scenario',kicker:'TWO',prompt:'陌生城市,有一整天完全属于你',sub:'你最先被哪一个吸引?',
   opts:[
     {vis:{emoji:'🏛'},label:'讲这座城历史的博物馆',delta:{E:-0.9,C:-0.4}},
     {vis:{emoji:'🧭'},label:'没攻略,随意乱走的老街',delta:{E:+0.5,F:-0.5,D:-0.3}},
     {vis:{emoji:'☕'},label:'能看风景发呆的咖啡馆',delta:{F:-0.7,A:-0.3}}]},
  {id:'q3',type:'tradeoff',kicker:'THREE',prompt:'天天要用的东西,只能优先一个',sub:'诚实一点',
   opts:[
     {vis:{emoji:'🎐'},label:'好看',delta:{C:-0.9}},
     {vis:{emoji:'🔧'},label:'好用',delta:{C:+0.9}},
     {vis:{emoji:'🌀'},label:'与众不同',delta:{D:-0.6,E:+0.3}}]},
  {id:'q4',type:'color',kicker:'FOUR',prompt:'哪一组颜色,你更想靠近?',sub:'凭直觉',
   opts:[
     {vis:{swatch:'calm'},label:'低饱和 · 米灰原木',delta:{A:-0.6,D:+0.5}},
     {vis:{swatch:'bw'},label:'高对比 · 黑白结构',delta:{C:-0.5,D:+0.4}},
     {vis:{swatch:'vivid'},label:'明亮 · 撞色活力',delta:{B:+0.7,F:-0.3}}]},
  {id:'q5',type:'image',kicker:'FIVE',prompt:'更喜欢哪一种花园?',sub:'',
   opts:[
     {vis:{svg:'gardenFormal'},label:'几何对称 · 法式秩序',delta:{A:-0.4,C:-0.5,D:+0.3}},
     {vis:{svg:'gardenWild'},label:'自然野趣 · 错落生长',delta:{A:+0.4,C:+0.3,D:-0.3}}]},
  {id:'q6',type:'image',kicker:'SIX',prompt:'哪一幅,你更想一直看下去?',sub:'',

/* ============================================================
   PART B · 计分 → 六轴画像
   ============================================================ */
const AXES=['A','B','C','D','E','F'];
const answers={};   // {q1:optionIndex,...}

function computeProfile(){
  const sum={},wsum={};
  AXES.forEach(a=>{sum[a]=0;wsum[a]=0});
  QUESTIONS.forEach(q=>{
    const oi=answers[q.id]; if(oi==null)return;
    const d=q.opts[oi].delta||{};
    for(const a in d){sum[a]+=d[a];wsum[a]+=Math.abs(d[a]);}
  });
  const axes={},confidence={};
  AXES.forEach(a=>{
    axes[a]=wsum[a]?+(sum[a]/wsum[a]).toFixed(3):0;   // 按总权重归一化 → −1..+1
    confidence[a]=+Math.min(1,wsum[a]/1.5).toFixed(2); // 证据量 = 置信度
  });
  return {axes,confidence,archetype:deriveArchetype(axes,confidence),keywords:deriveKeywords(axes,confidence)};
}

// 骨架三轴 A(优美↔崇高)×D(繁复↔极简),F/B 择一作气质修饰(单前缀,不叠加)
function deriveArchetype(axes,conf){
  const sublime = axes.A>=0;        // 崇高
  const minimal = axes.D>=0;        // 极简/纯粹
  const immersive = axes.F<0;       // 沉浸
  // 主名(A×D 四象限):干净的三字名词,不带"的"
  const base = sublime
    ? (minimal ? '漫游者' : '探险家')
    : (minimal ? '栖居者' : '耽美者');
  // 单一气质修饰:强轴优先(B/D/A 谁最强用谁),否则退到 F 轴沉浸/静观
  const cands=[
    {v:Math.abs(axes.B)*conf.B, on:axes.B<=-0.4&&conf.B>=0.4, word:'留白'},
    {v:Math.abs(axes.B)*conf.B, on:axes.B>=0.4&&conf.B>=0.4, word:'明丽'},
    {v:Math.abs(axes.A)*conf.A, on:axes.A>=0.5&&conf.A>=0.4, word:'苍茫'},
    {v:Math.abs(axes.A)*conf.A, on:axes.A<=-0.5&&conf.A>=0.4, word:'温润'},
    {v:Math.abs(axes.D)*conf.D, on:axes.D<=-0.5&&conf.D>=0.4, word:'繁盛'},
  ].filter(c=>c.on).sort((a,b)=>b.v-a.v);
  const prefix = cands.length ? cands[0].word : (immersive?'沉浸':'静观');
  return prefix+'的'+base;
}

// 各轴极 → 关键词(誊自 DESIGN.md §F);强轴(|v|≥.2 且 conf≥.4)取词,去重 ≤6
const AXIS_KEYWORDS={
  A:{neg:['温润','秀丽','和煦'],pos:['苍茫','辽阔','磅礴']},
  B:{neg:['幽玄','余白','朦胧'],pos:['明丽','饱和','盛放']},
  C:{neg:['构成','秩序','静观'],pos:['鲜活','烟火','体感']},
  D:{neg:['繁复','层叠','迷宫'],pos:['素净','纯粹','安定']},
  E:{neg:['求知','考据','脉络'],pos:['氛围','通感','微醺']},
  F:{neg:['沉浸','临场','忘我'],pos:['间距','俯瞰','澄明']}
};
function deriveKeywords(axes,conf){
  const scored=[];
  AXES.forEach(a=>{
    const v=axes[a]; if(Math.abs(v)<0.2||conf[a]<0.4)return;
    const pool=v<0?AXIS_KEYWORDS[a].neg:AXIS_KEYWORDS[a].pos;
    scored.push({w:Math.abs(v)*conf[a],word:pool[0]});   // 取该极首词,按强度×置信排序
    scored.push({w:Math.abs(v)*conf[a]*0.6,word:pool[1]});
  });
  scored.sort((x,y)=>y.w-x.w);
  const out=[];for(const s of scored){if(!out.includes(s.word))out.push(s.word);if(out.length>=5)break;}
  if(!out.length)out.push('还在成形','慢','在路上');
  return out;
}

/* ============================================================
   PART D · 画像揭晓屏(诗意克制 · 六轴雷达图)
   ============================================================ */
function radarSVG(axes){
  // 六边形雷达:A顶,顺时针 B C ? 我们用 A B C D E F 六个顶点
  const cx=150,cy=150,R=110;
  const labels={A:'优美↔崇高',B:'含蓄↔直白',C:'形式↔功能',D:'繁复↔极简',E:'智性↔体验',F:'沉浸↔静观'};
  // 每轴值 −1..+1 → 半径 0.15R..R(避免全塌到中心)
  const pts=AXES.map((a,i)=>{
    const ang=-Math.PI/2 + i*Math.PI/3;                 // 从正上方开始
    const val=(axes[a]+1)/2;                             // 0..1
    const r=R*(0.18+0.82*val);
    return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)];
  });
  // 网格环
  let grid='';
  [0.25,0.5,0.75,1].forEach(g=>{
    const ring=AXES.map((a,i)=>{const ang=-Math.PI/2+i*Math.PI/3;const r=R*g;
      return `${cx+r*Math.cos(ang)},${cy+r*Math.sin(ang)}`}).join(' ');
    grid+=`<polygon points="${ring}" fill="none" stroke="#5A6B82" stroke-width="1" opacity="${g===1?.5:.22}"/>`;
  });
  // 轴线 + 标签
  let axled='';
  AXES.forEach((a,i)=>{
    const ang=-Math.PI/2+i*Math.PI/3;
    const ex=cx+R*Math.cos(ang),ey=cy+R*Math.sin(ang);
    axled+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#5A6B82" stroke-width="1" opacity=".25"/>`;
    const lx=cx+(R+26)*Math.cos(ang),ly=cy+(R+26)*Math.sin(ang);
    axled+=`<text x="${lx}" y="${ly+4}" text-anchor="middle">${labels[a]}</text>`;
  });
  const poly=pts.map(p=>p.join(',')).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#E0C088"/>`).join('');
  return `<svg class="prof-radar" width="360" height="300" viewBox="-30 0 360 300">
    ${grid}${axled}
    <polygon points="${poly}" fill="rgba(224,192,136,.22)" stroke="#E0C088" stroke-width="2"/>
    ${dots}</svg>`;
}

// 依主导轴选文案调性
function toneOf(profile){
  const {axes}=profile;
  if(axes.F<-0.2) return 'immersive';        // 沉浸
  if(axes.A<-0.2 && axes.C<0) return 'contemplative'; // 优美+形式 → 静观细品
  if(axes.B>0.2||axes.D<-0.2) return 'vivid'; // 直白/繁复 → 明丽
  return 'plain';
}
const POEMS={
  immersive:kw=>`你不满足于"看见"一个地方——你要它<b>${kw[0]||'包裹'}</b>住你,漫过来,让你忘了自己站在哪里。
    那就往<b>大地会说话</b>的地方去:让风、光、和脚下的沙,替语言把话说完。`,
  contemplative:kw=>`你在意的是<b>光怎么落、线怎么走、比例对不对</b>。美对你是一件可以细看的事。
    你需要的不是热闹,是一处能<b>${kw[0]||'静观'}</b>的所在——退开半步,让眼睛慢慢地读。`,
  vivid:kw=>`你不怕满,不怕多,不怕<b>${kw[0]||'明丽'}</b>——层叠的、鲜活的、扑面而来的,你都接得住。
    该给你一段<b>信息丰盈</b>的路:市集、烟火、色彩,一处接一处地亮起来。`,
  plain:kw=>`你要的是<b>干净、笃定、留有余地</b>。不必满,不必赶,一处待够了,才去下一处。
    那就走一条<b>${kw[0]||'素净'}</b>的线——少即是多,把节奏交还给你自己。`
};
function showProfile(profile){
  const tone=toneOf(profile);
  const kw=profile.keywords;
  // 低置信轴打圆场
  const vague=AXES.filter(a=>profile.confidence[a]<0.4).length;
  const soften = vague>=3 ? `<div class="q-sub" style="color:#B3A791;margin-top:14px">（你有几面还在成形——这条路会替你慢慢试探）</div>`:'';
  const wrap=document.getElementById('profWrap');
  wrap.innerHTML=`
    <div class="p-kicker">你是谁 · 决定了路往哪走</div>
    ${radarSVG(profile.axes)}
    <div class="prof-arch">${profile.archetype}</div>
    <div class="prof-kw">${kw.map(k=>`<span>${k}</span>`).join('')}</div>
    <div class="prof-poem">${POEMS[tone](kw)}</div>
    ${soften}
    <button class="prof-cta" id="ctaGo">为你铺开这段路 →</button>`;
  document.getElementById('ctaGo').onclick=()=>{
    showConstraints(profile);
  };
  goto('profile');
  setTimeout(()=>wrap.classList.add('reveal'),120);
}

const KEY_SOUND="travel-xinjiang-sound";
let soundOn=(()=>{try{return localStorage.getItem(KEY_SOUND)==='1'}catch(e){return false}})();
let _actx=null;
function audioCtx(){
  if(!_actx){try{_actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){_actx=null}}
  if(_actx&&_actx.state==='suspended'){_actx.resume().catch(()=>{})}
  return _actx;
}
// 一声清脆木铃感:两个短振荡叠加,180ms 衰减
function ding(){
  if(!soundOn)return;
  const ctx=audioCtx();if(!ctx)return;
  const t0=ctx.currentTime;
  [ [880,0.16], [1320,0.11] ].forEach(([f,g])=>{
    const o=ctx.createOscillator(),a=ctx.createGain();
    o.type='sine';o.frequency.value=f;
    a.gain.setValueAtTime(0,t0);
    a.gain.linearRampToValueAtTime(g,t0+0.01);
    a.gain.exponentialRampToValueAtTime(0.0001,t0+0.19);
    o.connect(a).connect(ctx.destination);
    o.start(t0);o.stop(t0+0.2);
  });
}
// 三音上行(合章用)
function chime(){
  if(!soundOn)return;
  const ctx=audioCtx();if(!ctx)return;
  const base=ctx.currentTime;
  [660,880,1320].forEach((f,i)=>{
    const t0=base+i*0.13;
    const o=ctx.createOscillator(),a=ctx.createGain();
    o.type='sine';o.frequency.value=f;
    a.gain.setValueAtTime(0,t0);
    a.gain.linearRampToValueAtTime(0.14,t0+0.012);
    a.gain.exponentialRampToValueAtTime(0.0001,t0+0.32);
    o.connect(a).connect(ctx.destination);
    o.start(t0);o.stop(t0+0.34);
  });
}

  URC:{nm:'乌鲁木齐',full:'乌鲁木齐地窝堡',dir:'北疆草原、湖泊与沙漠'},
  KHG:{nm:'喀什',full:'喀什徕宁',dir:'南疆古城与帕米尔高原'},
  KCA:{nm:'库车',full:'库车龟兹',dir:'塔克拉玛干沙漠腹地'},
  KRL:{nm:'库尔勒',full:'库尔勒梨城',dir:'塔克拉玛干沙漠腹地'},
};

/* ============================================================
   PART G · 匹配:画像 → 路线(加权欧氏 + 置信度折权 + 破平)
   ============================================================ */
const AXIS_W={A:1.4,B:1.0,C:1.2,D:1.2,E:0.8,F:1.0};   // 骨架轴 A/C/D 加权
// 在给定候选池内选审美最匹配(加权欧氏 + 置信度折权 + 破平)
function matchRouteIn(pool,profile){
  const scored=pool.map(r=>{
    let d2=0;
    AXES.forEach(a=>{
      const w=AXIS_W[a]*(0.4+0.6*(profile.confidence[a]??0.5));  // 置信度折进权重
      const dv=(profile.axes[a]||0)-(r.sig[a]||0);
      d2+=w*dv*dv;
    });
    return {r,d:Math.sqrt(d2)};
  }).sort((x,y)=>x.d-y.d);
  // 破平:top2 距离差 <0.15 时,按最高置信轴 → 谁的 sig 更贴该轴取胜;再退到 |sig.A| 大者
  if(scored.length>=2 && (scored[1].d-scored[0].d)<0.15){
    const topAxis=AXES.slice().sort((a,b)=>profile.confidence[b]-profile.confidence[a])[0];
    const [c0,c1]=scored;
    const fit=(r)=>-Math.abs((profile.axes[topAxis]||0)-(r.sig[topAxis]||0));
    if(fit(c1.r)>fit(c0.r)) return c1.r;
    if(fit(c1.r)===fit(c0.r) && Math.abs(c1.r.sig.A||0)>Math.abs(c0.r.sig.A||0)) return c1.r;
  }
  return scored[0].r;
}
// 全量匹配(无约束时用,如无确定性输入的回退)
function matchRoute(profile){return matchRouteIn(ROUTES.slice(),profile);}

// 硬约束解析:客观 > 审美。机场先硬过滤路线池,审美只在池内选最匹配。
function resolveRoute(profile,cons){
  const airport=cons&&cons.airport;
  let pool=airport?ROUTES.filter(r=>(r.airports||[]).includes(airport)):ROUTES.slice();
  let compromised=false, note='';
  if(!pool.length){                       // 池空 → 坦白降级:退回全部,标记不完美
    pool=ROUTES.slice(); compromised=true;
    note='你选的机场附近没有正好落地的路线,我按最接近的为你铺开。';
  }
  // 审美最优(全量)是否被机场挡在池外?若是,轻声说明"起降地优先"
  const aestheticBest=matchRouteIn(ROUTES.slice(),profile);
  const r=matchRouteIn(pool,profile);
  const yielded = aestheticBest.id!==r.id;  // 审美最优解未能入选(被机场过滤)
  return {route:r, compromised, yielded, note};
}

// 解析 dur 字符串("1.5 日"/"半日"/"1 日")→ 天数
function durDays(s){
  if(!s)return 1;
  if(/半/.test(s))return 0.5;
  const m=String(s).match(/([\d.]+)/);
  return m?parseFloat(m[1]):1;
}
function sumDur(pins){return pins.reduce((a,p)=>a+durDays(p.dur),0);}
// 深拷贝一条路线(pins/route/badges 都要能独立裁剪,不污染 ROUTES 原对象)
function deepCopyRoute(r){
  return {
    ...r,
    pins:r.pins.map(p=>({...p})),
    route:r.route.slice(),
    optional:(r.optional||[]).slice(),
    badges:null,   // 裁剪后统一改成读当前 route 的动态 badges(见下)
  };
}
// 天数裁剪:少于建议 → 从 optional 尾部依次裁次要站;多于 → 提示放慢
function applyConstraints(r,cons){
  const suggest=Math.round(sumDur(r.pins));   // 建议天数 = 各站 dur 累加
  const clone=deepCopyRoute(r);
  const days=cons&&cons.days;
  if(days && days < suggest-1){
    // 天数不足:从 optional 尾部依次裁,直到贴近所选天数(骨架首末站永不裁)
    const cut=[...(clone.optional||[])];
    const skeleton=new Set([r.route[0], r.route[r.route.length-1]]);
    while(cut.length && sumDur(clone.pins) > days+0.5){
      const id=cut.pop();
      if(skeleton.has(id))continue;
      clone.pins=clone.pins.filter(p=>p.id!==id);
      clone.route=clone.route.filter(x=>x!==id);
    }
    if(clone.route.length < r.route.length)
      clone._daysNote=`建议 ${suggest} 天，你选了 ${days} 天——我把次要的驿站收了起来，为你留下 ${clone.route.length} 站的紧凑版，每一站都值得。`;
  } else if(days && days > suggest+1){
    clone._daysNote=`建议 ${suggest} 天，你有 ${days} 天——从容。不必赶路，每一站都能放慢，住上一晚，让地方真正住进你心里。`;
  }
  // badges 动态化:'all'/含裁剪站点的 cond 一律改读当前 route,裁掉站点后仍能点亮
  clone.badges=rebuildBadges(r,clone.route);
  return clone;
}
// 用裁剪后的 route 重建徽章:保留原 badge 的 icon/nm/首个进度类,但 all/合章类改读当前 route
function rebuildBadges(orig,route){
  const base=(orig.badges&&orig.badges.length)?orig.badges:[
    {id:'first',icon:'🌅',nm:'启程'},
    {id:'half',icon:'🧭',nm:'过半'},
    {id:'all',icon:'📖',nm:'合章'},
  ];
  const routeSet=new Set(route);
  return base.map(b=>{
    const nb={id:b.id,icon:b.icon,nm:b.nm};
    if(b.id==='first'){
      nb.cond=p=>Object.keys(p.arrived).length>=1;
    }else if(b.id==='half'){
      nb.cond=p=>Object.keys(p.arrived).filter(id=>routeSet.has(id)).length>=Math.ceil(route.length/2);
    }else if(b.id==='all'){
      nb.cond=p=>route.every(id=>p.arrived[id]);       // 合章:读当前(可能已裁)route
    }else{
      // 中间成就(如"集齐匠心")可能引用被裁站点 → 只按仍在 route 内的原条件近似:
      // 保留原 cond,但被裁站点视为"不要求"——包一层,缺失站点当已满足
      const orig_cond=b.cond;
      nb.cond=p=>{
        try{ return orig_cond({arrived:new Proxy(p.arrived,{get:(t,k)=>(routeSet.has(k)?t[k]:true)})}); }
        catch(e){ return route.every(id=>p.arrived[id]); }
      };
    }
    return nb;
  });
}


/* ============================================================
   PART H · 地图渲染引擎(沿用 xinjiang-map-demo.html)
   改造:GEO/PINS/ROUTE/BADGES/WHISPERS/SIGNOFF/KEY 全部 let
        由 loadRoute() 注入;fitGeo() 按路线自适应包围盒;
        drawMap() 支持 province / region 两种底图
   ============================================================ */
const W=1440,H=1080;
// 全疆省域投影范围(province backdrop 用)
const GEO_PROVINCE={lngMin:73,lngMax:96,latMin:34.5,latMax:49};
let GEO={...GEO_PROVINCE};           // 当前投影范围(loadRoute 中被 fitGeo 覆盖)
let PINS=[],ROUTE=[],BADGES=[],WHISPERS={},SIGNOFF={},KEY="travel-xinjiang-demo";
let backdrop='province';
let profileNow=null;
let state=null;                       // 只在 loadRoute 内赋值,早期 refresh 用 if(state) 守卫

// 经纬度 → SVG像素(简单等距投影;北在上)
function project(lng,lat){
  const x=(lng-GEO.lngMin)/(GEO.lngMax-GEO.lngMin)*W;
  const y=(GEO.latMax-lat)/(GEO.latMax-GEO.latMin)*H;
  return [x,y];
}
// 按路线 pin 包围盒自适应 GEO:18% padding + 强制 4:3 宽高比(cos 修经度)
function fitGeo(r){
  if(backdrop==='province')return {...GEO_PROVINCE};
  const lngs=r.pins.map(p=>p.lng),lats=r.pins.map(p=>p.lat);
  let lngMin=Math.min(...lngs),lngMax=Math.max(...lngs);
  let latMin=Math.min(...lats),latMax=Math.max(...lats);
  const padL=(lngMax-lngMin)*0.18||0.4, padA=(latMax-latMin)*0.18||0.4;
  lngMin-=padL;lngMax+=padL;latMin-=padA;latMax+=padA;
  // 强制宽高比 4:3(W/H)。经度按纬度余弦换算成"地面宽度"
  const midLat=(latMin+latMax)/2, kx=Math.cos(midLat*Math.PI/180);
  let lngSpan=(lngMax-lngMin)*kx, latSpan=(latMax-latMin);
  const target=(W/H)*(latSpan);      // 目标地面宽度 = 高宽比 × 纬度跨度
  if(lngSpan<target){                // 经度太窄 → 撑宽
    const add=(target-lngSpan)/kx/2;lngMin-=add;lngMax+=add;
  }else{                             // 经度太宽 → 撑高
    const addLat=(lngSpan/(W/H)-latSpan)/2;latMin-=addLat;latMax+=addLat;
  }
  // 给右下角(标题牌 + HUD)与左上角(罗盘 + 比例尺)留白:
  // 右下多扩、左上少扩,把地标群整体推向画面中偏上,四角控件不被 pin 压住。
  const lngW=lngMax-lngMin, latH=latMax-latMin;
  lngMax+=lngW*0.30;                  // 东侧(→右)留白,让开标题牌
  latMin-=latH*0.24;                  // 南侧(→下)留白,让开标题牌
  lngMin-=lngW*0.12;                  // 西侧(→左)少量留白,让开罗盘/比例尺
  latMax+=latH*0.10;                  // 北侧(→上)少量留白
  return {lngMin,lngMax,latMin,latMax};
}

/* ---------- localStorage 记忆(按路线命名,互不冲突) ---------- */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY))||fresh();if(!s.here)s.here=ROUTE[0];return s}catch(e){return fresh()}}
function fresh(){return{planned:{},arrived:{},badges:{},here:ROUTE[0]}}
function save(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}

/* ---------- 注入一条路线 → 地图 ---------- */
function loadRoute(r,profile){
  profileNow=profile||profileNow;
  PINS=r.pins; ROUTE=r.route.slice();
  backdrop=r.backdrop||'province';
  GEO=fitGeo(r);
  BADGES=r.badges||defaultBadges(r);
  WHISPERS=r.whispers||FALLBACK_WHISPERS;
  SIGNOFF=r.signoff||{};
  KEY="travel-xinjiang-"+r.id;
  // 断言:每个 ROUTE id 必须存在于 PINS,否则 project(undefined)=NaN
  ROUTE=ROUTE.filter(id=>PINS.some(p=>p.id===id));
  state=load();                      // 先赋 ROUTE 再 load,fresh() 才能取对 here
  if(!ROUTE.includes(state.here))state.here=ROUTE[0];
  // 起点即"已抵达"(旅程从此地展开):否则全线合章永远差起点这一站
  if(ROUTE[0]&&!state.arrived[ROUTE[0]]){state.arrived[ROUTE[0]]=nowStr();save();}
  setTitlePlate(r,profileNow);
  refresh();
}
function defaultBadges(r){
  return [
    {id:'first',icon:'🌅',nm:'启程',cond:p=>Object.keys(p.arrived).length>=1},
    {id:'half',icon:'🧭',nm:'过半',cond:p=>Object.keys(p.arrived).length>=Math.ceil(r.route.length/2)},
    {id:'all',icon:'📖',nm:'合章',cond:p=>r.route.every(id=>p.arrived[id])}
  ];
}
const FALLBACK_WHISPERS={_:['风穿过旷野','远处有轮廓','光在往西走','脚步是这页纸上的字','走着走着,天就暗了']};

// 标题牌:据画像注入副标(轻装饰,路线情绪为骨)+ 约束信息
function setTitlePlate(r,profile){
  document.getElementById('titleZh').textContent='新疆';
  document.getElementById('titleEn').textContent=r.en;
  const arch=profile?`为『${profile.archetype}』铺开`:'';
  // 约束行:同行 · 天数 · 从X机场进
  let consLine='';
  const c=constraints||loadConstraints();
  if(c){
    const bits=[];
    if(c.party&&PARTY_TXT[c.party])bits.push(PARTY_TXT[c.party]);
    if(c.days)bits.push(c.days+'天');
    if(c.airport&&AIRPORTS[c.airport])bits.push('从'+AIRPORTS[c.airport].nm+'进');
    if(bits.length)consLine=`<br><span style="font-size:.86em;opacity:.82">${bits.join(' · ')}</span>`;
  }
  // 审美让位于起降地时,轻声一句
  const yieldLine=(r._yielded||r._compromised)?`<br><span style="font-size:.8em;opacity:.7;font-style:italic">（起降地优先，已就近为你安排）</span>`:'';
  document.getElementById('titleSub').innerHTML=`${r.nm} · ${arch||'点击地标翻开这一章'}<br>${r.sub}${consLine}${yieldLine}`;
  document.getElementById('hudTot').textContent=r.route.length;
}

// 一次性信笺(复用 #story 层):首次进图时说明天数裁剪 / 就近降级
function showNoteLetter(title,body){
  const box=document.getElementById('story');
  box.innerHTML=`<div class="story-inner">
    <div class="story-day">规划师的话</div>
    <div class="story-nm">${title}</div>
    <div class="story-lines"><p>${body}</p></div>
    <div class="story-sign">—— 客观的事定了，路就照它来，替你把选择省去</div>
    <button>好的，出发</button>
  </div>`;
  box.querySelector('button').onclick=()=>box.classList.remove('on');
  box.classList.add('on');
  const p=box.querySelector('.story-lines p');
  setTimeout(()=>p.classList.add('show'),400);
  setTimeout(()=>{box.querySelector('.story-sign').classList.add('show');
    box.querySelector('button').classList.add('show');},1200);
}

// 省域:全疆写意轮廓 + 山脉/沙漠/河流(原 demo 逐字)

    s+=`<path d="M${dx-w},${yy} Q${dx-w*.4},${yy-13} ${dx},${yy} T${dx+w},${yy}" fill="none" stroke="#D97B5C" stroke-width="2" opacity=".3"/>`;}
  s+=`</g>`;
  s+=`<g filter="url(#wcSoft)">`;
  s+=wcRange([[75.5,42.4],[80,43.1],[84,43.3],[88,43.7],[92.5,43]],36,"#9FB8C4","#C9D6DD");
  s+=wcRange([[75,37.2],[79,36.5],[83,36],[87.5,36.3]],30,"#B7A48E","#D8CBB6");
  s+=wcRange([[85.5,47.6],[89,48],[92.5,47.1]],26,"#A9BBAF","#CCD8CD");
  s+=`</g>`;
  s+=`<g filter="url(#wcSoft)"><path d="M${project(78,40.2).join(',')} Q${project(82,40.7).join(',')} ${project(86,40.1).join(',')} T${project(90.5,39.8).join(',')}"
     fill="none" stroke="url(#waterG)" stroke-width="7" opacity=".8" stroke-linecap="round"/></g>`;

// 区域:无固定轮廓,通用柔渐变陆块 + 沿途柔和地形烘托(不失真)
function drawRegionBackdrop(){
  let s=`<rect width="${W}" height="${H}" fill="url(#regionG)"/>`;
  // 柔和纸面色块(水彩晕染,纯装饰,与经纬度无关的相对布局)
  s+=`<g filter="url(#wcSoft)" opacity=".5">
    <ellipse cx="${W*0.3}" cy="${H*0.32}" rx="360" ry="220" fill="#EBDCC8"/>
    <ellipse cx="${W*0.72}" cy="${H*0.6}" rx="420" ry="260" fill="#F1E6D6"/>
  </g>`;
  // 沿路线中轴,画一带写意山脊烘托高原/沙漠气质(据 backdrop 主题选色)
  const pts=ROUTE.map(id=>{const p=PINS.find(x=>x.id===id);return [p.lng,p.lat]});
  if(pts.length>=2){
    s+=`<g filter="url(#wcSoft)">`;
    // 在路线包围盒偏上方,平行画一列柔山
    const midLat=(GEO.latMin+GEO.latMax)/2;
    const ridge=[];
    for(let i=0;i<=4;i++){const lng=GEO.lngMin+(GEO.lngMax-GEO.lngMin)*(0.12+i*0.19);
      ridge.push([lng,GEO.latMax-(GEO.latMax-GEO.latMin)*0.16]);}
    s+=wcRange(ridge,30,"#B7A48E","#D8CBB6");
    s+=`</g>`;
  }
  return s;
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

// 水彩山体(原 demo 逐字)
function wcRange(pts,h,c1,c2){
  const px=pts.map(p=>project(p[0],p[1]));
  let s="";
  for(let i=0;i<px.length-1;i++){
    const[x1,y1]=px[i],[x2,y2]=px[i+1];const seg=Math.max(2,Math.round((x2-x1)/70));
    for(let j=0;j<seg;j++){
      const t=j/seg,t2=(j+1)/seg;
      const ax=x1+(x2-x1)*t,ay=y1+(y2-y1)*t;
      const cxp=x1+(x2-x1)*t2,cyp=y1+(y2-y1)*t2;
      const mx=(ax+cxp)/2,my=(ay+cyp)/2-h;
      s+=`<path d="M${ax},${ay+6} Q${mx},${my} ${cxp},${cyp+6} Z" fill="${c1}" opacity=".55"/>`;
      s+=`<path d="M${mx-9},${my+11} Q${mx},${my+2} ${mx+9},${my+11} Q${mx},${my+16} ${mx-9},${my+11} Z" fill="#FBF6EE" opacity=".85"/>`;
    }
  }
  for(let i=0;i<px.length-1;i++){const[x1,y1]=px[i],[x2,y2]=px[i+1];
    const mx=(x1+x2)/2,my=(y1+y2)/2-h*.6;
    s+=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="${c2}" stroke-width="3" opacity=".5"/>`;}
  return s;
}

/* ---------- 路线连线 + 点位 ---------- */
// animateSeg:传入"刚点亮的段索引"(ROUTE 中 i→i+1)时,只让该段做描出动画;
// 其余已亮段直接实线呈现。省略则全部静态(重绘/回访时用)。
function drawRoute(animateSeg){
  const svg=document.getElementById('map');
  let pathParts=[];
  ROUTE.forEach((id,i)=>{
    const p=PINS.find(x=>x.id===id);const[x,y]=project(p.lng,p.lat);
    pathParts.push((i===0?"M":"L")+x+","+y);
  });
  const dash=`<path d="${pathParts.join(' ')}" fill="none" stroke="${cssv('--navy')}" stroke-width="2"
     stroke-dasharray="3 8" opacity=".4"/>`;
  // 每个已到达的相邻段各自成 path,便于单段描出
  let segs="";
  for(let i=0;i<ROUTE.length-1;i++){
    if(state.arrived[ROUTE[i]]&&state.arrived[ROUTE[i+1]]){
      const a=PINS.find(x=>x.id===ROUTE[i]),b=PINS.find(x=>x.id===ROUTE[i+1]);
      const d=`M${project(a.lng,a.lat).join(',')} L${project(b.lng,b.lat).join(',')}`;
      const anim=(i===animateSeg)?' data-draw="1"':'';
      segs+=`<path d="${d}" fill="none" stroke="${cssv('--gold')}" stroke-width="4"
         opacity=".95" stroke-linecap="round" class="route-lit"${anim}/>`;
    }
  }
  svg.insertAdjacentHTML('beforeend',dash+segs);
  // 对标记了 data-draw 的段执行 stroke-dashoffset 描出(墨迹写出感)
  if(animateSeg!=null){
    const seg=svg.querySelector('path.route-lit[data-draw="1"]');
    if(seg){
      const len=seg.getTotalLength();
      seg.style.strokeDasharray=len;
      seg.style.strokeDashoffset=len;
      // 强制回流后过渡到 0
      seg.getBoundingClientRect();
      seg.style.transition='stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)';
      seg.style.strokeDashoffset='0';
    }
  }
}
// 墨晕:在某 pin 坐标处放一个淡金圆,r 从 0 放大+淡出,~700ms 自removed
function inkBloom(id){
  const p=PINS.find(x=>x.id===id);if(!p)return;
  const[x,y]=project(p.lng,p.lat);
  const svg=document.getElementById('map');
  const ns="http://www.w3.org/2000/svg";
  const c=document.createElementNS(ns,'circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','2');
  c.setAttribute('fill','none');
  c.setAttribute('stroke',cssv('--gold'));c.setAttribute('stroke-width','2.5');
  c.setAttribute('opacity','.85');
  svg.appendChild(c);
  c.animate([
    {r:'2',opacity:.85,strokeWidth:2.5},
    {r:'42',opacity:0,strokeWidth:.5}
  ],{duration:720,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  setTimeout(()=>c.remove(),780);
}
function drawPins(){
  const box=document.getElementById('pins');box.innerHTML="";
  PINS.forEach(p=>{
    const[x,y]=project(p.lng,p.lat);
    const st=state.arrived[p.id]?"arrived":(state.planned[p.id]?"planned":"idle");
    const el=document.createElement('div');
    el.className="pin";el.dataset.state=st;el.dataset.id=p.id;el.dataset.dir=p.lblDir||"bottom";
    el.style.left=(x/W*100)+"%";el.style.top=(y/H*100)+"%";
    el.innerHTML=`<div class="stack"><div class="icon"><span class="glyph">${p.icon}</span><span class="stamp">到</span></div>
      <div class="tip"></div></div><div class="lbl">${p.nm}</div>`;
    el.onclick=()=>openCard(p.id);
    box.appendChild(el);
  });
}

/* ---------- 卡片 ---------- */
function openCard(id){
  const p=PINS.find(x=>x.id===id);
  const arrived=state.arrived[id],planned=state.planned[id];
  // 顶部配图:有 img 用真实照片,失败/缺省用按类型着色的氛围渐变兜底
  const photoHTML = p.img
    ? `<div class="card-photo"><img src="images/${p.img}" alt="${p.nm}" loading="lazy"
         onerror="this.parentNode.classList.add('placeholder','ph-${p.type}');this.remove();">
         <div class="photo-cap">${p.icon} ${p.nm}</div></div>`
    : `<div class="card-photo placeholder ph-${p.type}"><div class="ph-emoji">${p.icon}</div>
         <div class="photo-cap">${p.nm}</div></div>`;
  // 「这个地点,值得——」手风琴(可多开)
  const worth = p.worth || [];
  const worthHTML = worth.map((w,i)=>`
    <div class="worth-item" data-wi="${i}">
      <button class="worth-t" type="button">
        <span class="worth-tx">${w.t}</span><span class="worth-cv">⌄</span>
      </button>
      <div class="worth-d"><p>${w.d}</p></div>
    </div>`).join('');
  document.getElementById('card').innerHTML=`
    <div class="hd">
      <button class="close" onclick="closeCard()">✕</button>
      <div class="day">${p.day} · ${p.dur}</div>
      <div class="nm">${p.nm}</div><div class="en">${p.en}</div>
    </div>
    <div class="bd">
      ${photoHTML}
      <div class="sec"><h4>本页安排 <span class="meta">${p.plan}</span></h4><p>${p.note}</p></div>
      <div class="sec"><h4>专家的话</h4><div class="note">&ldquo;${p.quote}&rdquo;</div></div>
      ${worth.length?`<div class="sec worth"><h4>这个地点,值得—— <span class="meta">点开展开</span></h4>
        <div class="worth-list">${worthHTML}</div></div>`:''}
    </div>
    ${arrived?`<div class="stampts">✦ 已于 ${arrived} 到达此地</div>`:''}
    <div class="actions">
      <button class="gold" id="btnGo" ${arrived?'disabled':''}>${arrived?'★ 已抵达':'去这里 →'}</button>
    </div>`;
  document.getElementById('btnGo').onclick=()=>{markArrive(id)};
  // 手风琴:点击标题切换展开(多开),max-height 过渡
  document.querySelectorAll('#card .worth-item .worth-t').forEach(btn=>{
    btn.onclick=()=>{
      const item=btn.closest('.worth-item');
      const d=item.querySelector('.worth-d');
      const open=item.classList.toggle('open');
      d.style.maxHeight = open ? (d.scrollHeight+'px') : '0px';
    };
  });
  document.getElementById('cardMask').classList.add('on');
}
function closeCard(){document.getElementById('cardMask').classList.remove('on')}

/* ---------- 打卡逻辑 ---------- */
function markPlan(id){state.planned[id]=true;save();refresh();openCard(id)}
function markArrive(id){
  state.planned[id]=true;save();
  closeCard();
  const path=routeBetween(state.here,id);
  walkPath(path,()=>{
    state.here=id;
    state.arrived[id]=nowStr();save();
    // 计算刚点亮的段(id 在 ROUTE 中与其前一站构成的段)
    const j=ROUTE.indexOf(id);
    _animateSeg=(j>0&&state.arrived[ROUTE[j-1]])?j-1:null;
    refresh();
    _animateSeg=null;
    arrivalRitual(id);
    checkBadges();
    setTimeout(()=>revealStory(id),350);
    if(ROUTE.every(x=>state.arrived[x]))setTimeout(()=>replay({then:showCongrats}),1400);
  });
}
// A4 到达仪式:纸面微震 + 淡金涟漪 + 盖章脉冲 + 墨晕 + 一声清脆
function arrivalRitual(id){
  const stage=document.getElementById('stage');
  if(stage){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
    setTimeout(()=>stage.classList.remove('shake'),300);}
  // 墨晕(SVG 层)
  inkBloom(id);
  // 涟漪 + 盖章脉冲(定位到该 pin)
  const pin=document.querySelector(`.pin[data-id="${id}"]`);
  if(pin){
    const rip=document.createElement('div');
    rip.className='ripple';
    pin.appendChild(rip);
    setTimeout(()=>rip.remove(),760);
    const stamp=pin.querySelector('.stamp');
    if(stamp){stamp.classList.remove('pulse');void stamp.offsetWidth;stamp.classList.add('pulse');
      setTimeout(()=>stamp.classList.remove('pulse'),520);}
  }
  ding();
}
function routeBetween(fromId,toId){
  let i=ROUTE.indexOf(fromId),j=ROUTE.indexOf(toId);
  if(i<0)i=0;
  const seq=[];
  if(i<=j){for(let k=i;k<=j;k++)seq.push(ROUTE[k]);}
  else{for(let k=i;k>=j;k--)seq.push(ROUTE[k]);}
  return seq;
}
function nowStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function checkBadges(){BADGES.forEach(b=>{if(b.cond(state))state.badges[b.id]=true});save();renderBadges()}

/* ---------- HUD / 徽章 ---------- */
function renderHUD(){
  const arr=Object.keys(state.arrived).length,tot=ROUTE.length;
  document.getElementById('hudArr').textContent=arr;
  document.getElementById('hudTot').textContent=tot;
  document.getElementById('hudBar').style.width=(arr/tot*100)+"%";
}
function renderBadges(){
  document.getElementById('hudBadges').innerHTML=BADGES.map(b=>
    `<div class="badge ${state.badges[b.id]?'on':''}" title="${b.nm}">${b.icon}</div>`).join('');
}

/* ---------- 足迹回放 B3:电影式重走 ---------- */
let _replaying=false;
let _replayThen=null;   // 回放结束后的回调(自动流程用:接合章书页)
function replay(opts){
  if(_replaying)return;
  const seq=ROUTE.filter(id=>state.arrived[id]);
  if(!seq.length){replayFlash('还没有足迹','走过一站后,再来回看这段路','no journey yet');
    setTimeout(hideReplayFlash,1600);return;}
  _replaying=true;
  _replayThen=(opts&&typeof opts.then==='function')?opts.then:null;
  const stage=document.getElementById('stage');
  const realHere=state.here;
  stage.classList.add('replaying');
  closeCard();
  document.getElementById('story').classList.remove('on');
  // 天光按"重走进度"实时插值:临时覆写 applyDaylight 的比例
  let dayT=0;
  const setDay=(t)=>{ _replayDayT=t; applyDaylight(); };
  _replayDayT=0; applyDaylight();
  // 若只到 1 站:放这一站的信笺闪一下即可
  const layer=document.getElementById('walker');
  const pts=seq.map(id=>{const p=PINS.find(x=>x.id===id);return project(p.lng,p.lat)});
  layer.innerHTML=walkerSVG(pts[0][0],pts[0][1]);
  flashStation(seq[0]);
  let seg=0;
  const total=Math.max(1,seq.length-1);
  const walkSeg=()=>{
    const fig=document.getElementById('figure');
    if(seg>=seq.length-1){finishReplay(realHere);return;}
    const[x1,y1]=pts[seg],[x2,y2]=pts[seg+1];
    const dist=Math.hypot(x2-x1,y2-y1);
    const dur=Math.max(320,dist*3.2*0.45);   // 加速版
    const flip=x2<x1?-1:1;
    document.getElementById('figBody').setAttribute('transform',`scale(${flip},1)`);
    const anim=fig.animate([
      {transform:`translate(${x1}px,${y1}px)`},
      {transform:`translate(${(x1+x2)/2}px,${(y1+y2)/2-8}px)`},
      {transform:`translate(${x2}px,${y2}px)`}
    ],{duration:dur,easing:'ease-in-out',fill:'forwards'});
    anim.onfinish=()=>{
      fig.style.transform=`translate(${x2}px,${y2}px)`;
      seg++;
      setDay(seg/total);          // 天光随进度晨→暮加速轮转
      flashStation(seq[seg]);
      setTimeout(walkSeg,760);
    };
  };
  setTimeout(walkSeg,900);
}
function finishReplay(realHere){
  hideReplayFlash();
  state.here=realHere;
  _replayDayT=null;               // 天光复位到真实进度
  _replaying=false;
  document.getElementById('stage').classList.remove('replaying');
  refresh();
  // 自动流程:回放播完 → 稍候接合章书页
  const cb=_replayThen; _replayThen=null;
  if(cb)setTimeout(cb,900);
}
// 快闪一张信笺缩影(复用 pin 文案),1.1s 自动淡出
function flashStation(id){
  const p=PINS.find(x=>x.id===id);if(!p)return;
  const one=(p.quote||'').split(/(?<=[。!?])/).map(s=>s.trim()).filter(Boolean)[0]||'你到过这里。';
  replayFlash(p.nm,one,p.en||'');
}
function replayFlash(nm,tx,en){
  const el=document.getElementById('replayFlash');if(!el)return;
  el.innerHTML=`<div class="rf-nm">${nm}</div><div class="rf-tx">${tx}</div>${en?`<div class="rf-en">${en}</div>`:''}`;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'),1100);
}
function hideReplayFlash(){const el=document.getElementById('replayFlash');if(el){el.classList.remove('on');clearTimeout(el._t);}}

/* ---------- 一整天的光 ---------- */
let _replayDayT=null;   // 回放期间用它覆写进度比例;null 时用真实到达比例
function applyDaylight(){
  const arr=Object.keys(state.arrived).length,tot=ROUTE.length;
  const t=_replayDayT!=null?_replayDayT:(tot?arr/tot:0);
  const el=document.getElementById('daylight');
  const dawn ={a:'#8CA6C8',b:'#B9C4D6'};
  const noon ={a:'#FBF3E4',b:'#FDF8EE'};
  const dusk ={a:'#F0A94E',b:'#C86A34'};
  let c1,c2,op;
  if(t<0.45){const k=t/0.45;c1=mix(dawn.a,noon.a,k);c2=mix(dawn.b,noon.b,k);op=0.6-0.32*k;}
  else{const k=(t-0.45)/0.55;const ek=k*k;
    c1=mix(noon.a,dusk.a,ek);c2=mix(noon.b,dusk.b,ek);op=0.28+0.68*ek;}
  el.style.background=`radial-gradient(120% 95% at 50% 8%, ${c2} 0%, ${c1} 100%)`;
  el.style.opacity=op.toFixed(2);
  const glow=document.getElementById('duskGlow');
  glow.style.opacity = t>=0.6 ? Math.min(1,(t-0.6)/0.4).toFixed(2) : '0';
}
function mix(h1,h2,k){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(h1),b=p(h2);
  const r=Math.round(a[0]+(b[0]-a[0])*k),g=Math.round(a[1]+(b[1]-a[1])*k),bl=Math.round(a[2]+(b[2]-a[2])*k);
  return `rgb(${r},${g},${bl})`;
}
/* ---------- B4 合章书页 ---------- */
function escXml(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))}
// 纯 SVG 渲染一张竖版藏书票/邮票(文字用 <text>,不依赖 HTML 布局)
function buildStampCardSVG(){
  const r=ROUTES.find(x=>x.id===loadChosen())||{nm:'新疆',en:'Xinjiang'};
  const profile=loadProfile();
  const arch=profile&&profile.archetype?`为『${profile.archetype}』铺开`:'一路走完';
  const stations=ROUTE.filter(id=>state.arrived[id]).map(id=>{const p=PINS.find(x=>x.id===id);return p?p.nm:''}).filter(Boolean);
  const sign=(SIGNOFF[ROUTE[ROUTE.length-1]]||'你合上了这一章 —— 苍茫已成为你的一部分').replace(/^—+\s*/,'');
  const dates=Object.values(state.arrived).filter(Boolean);
  const dateStr=dates.length?dates[dates.length-1].split(' ')[0]:'';
  const navy='#2A3A5C',gold='#C79A4B',coral='#C55A4A',paper='#F7F1E3';
  const W=392,Hh=560;
  // 站点清单(每行一个,居中)
  const listY0=290, lh=25;
  const stationLines=stations.map((s,i)=>
    `<text x="${W/2}" y="${listY0+i*lh}" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="16" fill="${navy}">${escXml(s)}</text>`
  ).join('');
  const svg=
`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}">
  <rect x="0" y="0" width="${W}" height="${Hh}" fill="${paper}"/>
  <rect x="12" y="12" width="${W-24}" height="${Hh-24}" fill="none" stroke="${navy}" stroke-width="2"/>
  <rect x="20" y="20" width="${W-40}" height="${Hh-40}" fill="none" stroke="${gold}" stroke-width="1" stroke-dasharray="2 5"/>
  <text x="${W/2}" y="70" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="17" fill="${gold}" letter-spacing="2">a chapter, sealed</text>
  <text x="${W/2}" y="132" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="900" font-size="40" fill="${navy}" letter-spacing="3">${escXml(r.nm)}</text>
  <text x="${W/2}" y="162" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="16" fill="${navy}" opacity="0.6" letter-spacing="2">${escXml(r.en||'')}</text>
  <line x1="${W/2-60}" y1="188" x2="${W/2+60}" y2="188" stroke="${gold}" stroke-width="1.5"/>
  <text x="${W/2}" y="222" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="18" fill="${coral}" font-weight="700">${escXml(arch)}</text>
  <text x="${W/2}" y="262" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14" fill="${navy}" opacity="0.55" letter-spacing="3">${stations.length} stops walked</text>
  ${stationLines}
  <text x="${W/2}" y="${Hh-96}" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="${navy}" opacity="0.8">${escXml(sign)}</text>
  <text x="${W/2}" y="${Hh-64}" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="14" fill="${navy}" opacity="0.5" letter-spacing="2">${escXml(dateStr)}</text>
  <g transform="translate(${W-72},${Hh-72})">
    <circle cx="0" cy="0" r="28" fill="none" stroke="${coral}" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Noto Serif SC',serif" font-weight="900" font-size="20" fill="${coral}" opacity="0.9">合章</text>
  </g>
</svg>`;
  return svg;
}
function showCongrats(){
  const holder=document.getElementById('stampCard');
  if(holder)holder.innerHTML=buildStampCardSVG();
  document.getElementById('congrats').classList.add('on');
  chime();
}
// 保存:优先 PNG(离屏 canvas);失败兜底 SVG 下载
function downloadStamp(){
  const svg=buildStampCardSVG();
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    try{
      const scale=2, cw=392*scale, ch=560*scale;
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#F7F1E3';ctx.fillRect(0,0,cw,ch);
      ctx.drawImage(img,0,0,cw,ch);
      cv.toBlob(b=>{
        if(!b){fallbackSvg(url);return;}
        const purl=URL.createObjectURL(b);
        triggerDownload(purl,'新疆·合章书页.png');
        setTimeout(()=>{URL.revokeObjectURL(purl);URL.revokeObjectURL(url);},1500);
      },'image/png');
    }catch(e){fallbackSvg(url);}
  };
  img.onerror=()=>fallbackSvg(url);
  img.src=url;
}
function fallbackSvg(url){triggerDownload(url,'新疆·合章书页.svg');setTimeout(()=>URL.revokeObjectURL(url),1500);}
function triggerDownload(href,name){
  const a=document.createElement('a');a.href=href;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}

/* ---------- 小人物 + 行走(原 demo 逐字) ---------- */
function drawWalker(){
  const layer=document.getElementById('walker');
  const here=PINS.find(x=>x.id===state.here)||PINS.find(x=>x.id===ROUTE[0]);
  if(!here){layer.innerHTML="";return}
  const[x,y]=project(here.lng,here.lat);
  layer.innerHTML=walkerSVG(x,y);
}
function walkerSVG(x,y){
  return `<g id="figure" style="transform:translate(${x}px,${y}px)">
    <g id="figBody">
      <ellipse cx="0" cy="2" rx="13" ry="4" fill="#2A3A5C" opacity=".18"/>
      <path d="M-9,-4 Q-11,-26 0,-28 Q11,-26 9,-4 Z" fill="${cssv('--coral')}" stroke="${cssv('--navy')}" stroke-width="1.5"/>
      <circle cx="0" cy="-34" r="7.5" fill="#F3D9C4" stroke="${cssv('--navy')}" stroke-width="1.5"/>
      <path d="M-7,-35 Q0,-44 7,-35 Q6,-40 0,-41 Q-6,-40 -7,-35 Z" fill="${cssv('--navy')}"/>
      <rect x="4" y="-24" width="7" height="10" rx="3" fill="${cssv('--gold')}" opacity=".9"/>
    </g>
  </g>`;
}
function walkPath(seq,done){
  const layer=document.getElementById('walker');
  if(seq.length<2){done&&done();return}
  const pts=seq.map(id=>{const p=PINS.find(x=>x.id===id);return project(p.lng,p.lat)});
  layer.innerHTML=walkerSVG(pts[0][0],pts[0][1]);
  let seg=0;
  const walkSeg=()=>{
    const fig=document.getElementById('figure');
    if(seg>=pts.length-1){done&&done();return}
    const[x1,y1]=pts[seg],[x2,y2]=pts[seg+1];
    const dist=Math.hypot(x2-x1,y2-y1);
    const dur=Math.max(700,dist*3.2);
    const flip=x2<x1?-1:1;
    document.getElementById('figBody').setAttribute('transform',`scale(${flip},1)`);
    whisperAlong((x1+x2)/2,(y1+y2)/2,seq[seg],seq[seg+1]);
    const anim=fig.animate([
      {transform:`translate(${x1}px,${y1}px)`},
      {transform:`translate(${(x1+x2)/2}px,${(y1+y2)/2-8}px)`},
      {transform:`translate(${x2}px,${y2}px)`}
    ],{duration:dur,easing:'ease-in-out',fill:'forwards'});
    anim.onfinish=()=>{fig.style.transform=`translate(${x2}px,${y2}px)`;seg++;walkSeg()};
  };
  walkSeg();
}
let _whisperIdx=0;
function whisperAlong(cx,cy,fromId,toId){
  const key=fromId+">"+toId;
  const pool=WHISPERS[key]||WHISPERS._||FALLBACK_WHISPERS._;
  const txt=pool[_whisperIdx++%pool.length];
  const layer=document.getElementById('walker');
  const ns="http://www.w3.org/2000/svg";
  const t=document.createElementNS(ns,'text');
  t.setAttribute('x',cx);t.setAttribute('y',cy-46);
  t.setAttribute('text-anchor','middle');t.setAttribute('class','whisper');
  t.textContent='· '+txt+' ·';
  layer.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>t.remove(),3600);
}
function revealStory(id){
  const p=PINS.find(x=>x.id===id);
  const box=document.getElementById('story');
  let lines=(p.quote||'').split(/(?<=[。!?])/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)lines=['这一页,你亲自到过了。'];
  const sign=SIGNOFF[id]||"—— 这一页,写给此刻在场的你";
  box.innerHTML=`<div class="story-inner">
    <div class="story-day">${p.day} · 这一页的故事</div>
    <div class="story-nm">${p.nm}</div>
    <div class="story-lines">${lines.map(l=>`<p>${l}</p>`).join('')}</div>
    <div class="story-sign">${sign}</div>
    <button>合上，继续走</button>
  </div>`;
  box.querySelector('button').onclick=()=>box.classList.remove('on');
  box.classList.add('on');
  const ps=[...box.querySelectorAll('.story-lines p')];
  ps.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),500+i*950));
  const after=500+ps.length*950+300;
  setTimeout(()=>{box.querySelector('.story-sign').classList.add('show');
    box.querySelector('button').classList.add('show');},after);
}

  drawMap();drawRoute(_animateSeg);drawPins();drawWalker();applyDaylight();renderHUD();renderBadges();

function scaleStage(){
  const iw=window.innerWidth, ih=window.innerHeight;
  const stage=document.getElementById('stage');
  const vp=document.getElementById('scrMap');
  // 竖屏窄屏(手机):按宽度铺满,顶部对齐,可上下滑动看全图。
  // ——4:3 横向地图在竖屏取 min 会缩到中间一小条、四周留白;改为铺满宽度。
  // transform:scale 不改变布局盒尺寸,故用负 margin 把布局高度收缩到视觉高度,
  // 让父层 overflow-y 的滚动区正好等于地图实际高度(否则会滚出一片空白)。
  const portraitPhone = ih>iw && iw<820;
  if(portraitPhone){
    const s=iw/W;                        // 铺满宽度(不横向溢出)
    const scaledH=Math.round(H*s);
    // 用 block 布局 + 顶部对齐:transform 不改布局盒,故显式把 viewport 内容高度
    // 设为视觉高度(padding-bottom 撑出可滚区),再据此决定是否需要滚动/垂直居中。
    stage.style.transformOrigin='top left';
    stage.style.transform=`scale(${s})`;
    stage.style.marginLeft='0'; stage.style.marginBottom='0';
    if(vp){
      vp.style.display='block';
      vp.style.overflowX='hidden'; vp.style.webkitOverflowScrolling='touch';
      vp.style.overflowY = scaledH>ih ? 'auto' : 'hidden';
      // 图比屏矮时上下留白平分,让地图垂直居中;否则贴顶可下滑
      const padTop = scaledH<ih ? Math.round((ih-scaledH)/2) : 0;
      vp.style.paddingTop = padTop+'px';
      // 让滚动内容高度=视觉高度:给 stage 之后垫一个等高占位(用 stage 自身的 margin-bottom 收缩)
      stage.style.marginBottom = Math.round(-(H-scaledH))+'px';
    }
  }else{
    const s=Math.min(iw/W, ih/H);
    stage.style.transformOrigin='center center';
    stage.style.transform=`scale(${s})`;
    stage.style.marginLeft='0'; stage.style.marginBottom='0';
    if(vp){vp.style.display='flex'; vp.style.paddingTop='0'; vp.style.alignItems='center'; vp.style.overflowY='hidden'; vp.style.overflowX='hidden';}
  }
}
window.addEventListener('resize',scaleStage);
window.addEventListener('orientationchange',()=>setTimeout(scaleStage,120));

/* ============================================================
   BOOT · 状态机入口
   回访(已有画像+已选路线)→ 直接进地图;否则从问答开始
   ============================================================ */
(function boot(){
  scaleStage();
  const savedProfile=loadProfile(), savedChosen=loadChosen();
  const savedRoute=savedChosen?ROUTES.find(r=>r.id===savedChosen):null;
  constraints=loadConstraints();
  if(savedProfile && savedRoute){
    // 回访:若当初收集过约束,按约束重建裁剪后的路线(不重复弹信笺——非首次进图)
    const route=constraints?applyConstraints(savedRoute,constraints):savedRoute;
    enterMap(route,savedProfile);
  }else{
    goto('quiz');
    renderQuestion();
  }
})();
